name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' 
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21' 

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Angular Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build APK (Debug)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Generate Keystore (Si no existe)
        working-directory: ./android/app
        run: |
          if [ ! -f "release.jks" ]; then
            keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias impostor -dname "CN=dj_ra, OU=Impostor, O=Impostor, L=Madrid, ST=Madrid, C=ES" -storepass Imp0storReleaseKey2026XpQ -keypass Imp0storReleaseKey2026XpQ
            git config --global user.name "antigravity[bot]"
            git config --global user.email "bot@antigravity.io"
            git add release.jks
            git commit -m "chore: Auto-generate Android App Keystore"
            git push origin HEAD:main
            git push origin HEAD:develop || true
          fi

      - name: Build AAB (Release Bundle for Play Store)
        working-directory: ./android
        run: |
          ./gradlew bundleRelease
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/IMPOSTIFY-OFICIAL-PLAY-STORE.aab

      - name: Encrypt Keystore with PEPK (for Google Play Console App Signing)
        working-directory: ./android/app
        run: |
          if [ -f "pepk.jar" ] && [ -f "encryption_public_key.pem" ]; then
            export PASS="Imp0storReleaseKey2026XpQ"
            java -jar pepk.jar --keystore=release.jks --alias=impostor --output=output.zip --include-cert --rsa-aes-encryption --encryption-key-path=encryption_public_key.pem --keystore-pass="$PASS" --key-pass="$PASS"
          fi

      - name: Upload Security Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: impostor-keystore-backup
          path: android/app/release.jks

      - name: Upload PEPK Output ZIP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LLAVE-ENCRIPTADA-PEPK-output-zip
          path: android/app/output.zip

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-DE-PRUEBAS-NO-SUBIR-A-PLAY-STORE
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BUNDLE-FINAL-OFICIAL-PLAY-STORE
          path: android/app/build/outputs/bundle/release/IMPOSTIFY-OFICIAL-PLAY-STORE.aab
