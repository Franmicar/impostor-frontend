name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_PATH: release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' 
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21' 

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Angular Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Release Keystore (desde GitHub Secret, nunca en el repo)
        working-directory: ./android/app
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build APK (Debug)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build AAB (Release Bundle for Play Store)
        working-directory: ./android
        run: |
          ./gradlew bundleRelease
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/DECEPTRA-OFICIAL-PLAY-STORE.aab

      - name: Remove decoded keystore from runner
        if: always()
        working-directory: ./android/app
        run: rm -f release.jks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-DE-PRUEBAS-NO-SUBIR-A-PLAY-STORE
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BUNDLE-FINAL-OFICIAL-PLAY-STORE
          path: android/app/build/outputs/bundle/release/DECEPTRA-OFICIAL-PLAY-STORE.aab
