# Configuración de compilación para Codemagic
workflows:
  ios-release:
    name: Deceptra iOS Release
    integrations:
      app_store_connect: app_store_key # Conexión configurada en Codemagic
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios-signing # Importar el grupo de variables de firma
      node: 22.12.0 # Versión de Node.js compatible con Angular v21
      xcode: latest  # Última versión estable de Xcode
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'develop'
          include: true
        - pattern: 'main'
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Build Angular web assets
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Setup Keychain and iOS Certificates
        script: |
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          keychain add-certificates --certificate /tmp/cert.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
          xcode-project use-profiles --profiles /tmp/profile.mobileprovision
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --clean \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - franmicarrasquilla@gmail.com
        notify:
          success: true
          failure: true
